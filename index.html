<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>제주 카페 이야기</title>
    <style>
      @font-face { font-family: 'Galmuri11'; src: url('./fonts/Galmuri11.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'Galmuri11'; src: url('./fonts/Galmuri11-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
      html, body, #root { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #1e1e1e; font-family: 'Galmuri11', system-ui, sans-serif; }
      /* 탭 지연(300ms)·더블탭 확대를 끈다 — 단추를 누른 만큼 바로 먹히게 */
      button { touch-action: manipulation; }
      /* 창 탭 줄: 칸을 고르게 나눠 가지는 한 벌 단추 (좁은 폰에서 글자가 세로로 쪼개지지 않게) */
      .segbar { display: flex; gap: 4px; flex-wrap: wrap; }
      .segbar > button { flex: 1 1 0; min-width: 0; min-height: 34px; white-space: nowrap; }
      /* 하단 메뉴: 네 칸을 고르게 */
      .navbar > button { flex: 1 1 0; min-width: 0; }
      canvas, img.px { image-rendering: pixelated; image-rendering: crisp-edges; }
      /* 맵을 끌거나 길게 누를 때 UI 글자가 선택되거나 iOS 콜아웃이 뜨지 않게. 입력칸은 그대로. */
      #root { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #root input, #root textarea { -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
